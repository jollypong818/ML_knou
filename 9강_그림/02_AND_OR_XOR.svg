3445">0</text><text x="1095" y="383" font-size="14" text-anchor="middle" fill="#263445">1</text><text x="840" y="130" font-size="14" text-anchor="middle" fill="#263445">1</text><circle cx="865" cy="355" r="10" fill="#2166ac"/><text x="885" y="343" font-size="17" text-anchor="middle" fill="#263445">0</text><polygon points="865,114 854,135 876,135" fill="#d66016"/><text x="885" y="113" font-size="17" text-anchor="middle" fill="#263445">1</text><polygon points="1095,344 1084,365 1106,365" fill="#d66016"/><text x="1115" y="343" font-size="17" text-anchor="middle" fill="#263445">1</text><circle cx="1095" cy="125" r="10" fill="#2166ac"/><text x="1115" y="113" font-size="17" text-anchor="middle" fill="#263445">0</text></svg>