<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" style="font-family:Malgun Gothic,sans-serif"><rect width="100%" height="100%" fill="white"/><text x="600" y="30" font-size="23" text-anchor="middle" fill="#263445">AND·OR는 직선 하나로 분리 / XOR는 직선 하나로 분리 불가</text><text x="600" y="60" font-size="17" text-anchor="middle" fill="#263445">파란 원 = 정답 0    주황 삼각형 = 정답 1</text><text x="180" y="100" font-size="23" text-anchor="middle" fill="#263445">AND</text><line x1="45" y1="355" x2="330" y2="355" stroke="#9aabb9" stroke-width="2"/><line x1="65" y1="110" x2="65" y2="375" stroke="#9aabb9" stroke-width="2"/><text x="180" y="410" font-size="17" text-anchor="middle" fill="#263445">입력 x₁</text><text x="45" y="109" font-size="17" text-anchor="middle" fill="#263445">입력 x₂</text><line x1="180.0" y1="125" x2="295" y2="240.0" stroke="#9aabb9" stroke-width="2"/><text x="65" y="383" font-size="14" text-anchor="middle" fill="#263445">0</text><text x="40" y="360" font-size="14" text-anchor="middle" fill="#263445">0</text><text x="295" y="383" font-size="14" text-anchor="middle" fill="#263445">1</text><text x="40" y="130" font-size="14" text-anchor="middle" fill="#263445">1</text><circle cx="65" cy="355" r="10" fill="#2166ac"/><text x="85" y="343" font-size="17" text-anchor="middle" fill="#263445">0</text><circle cx="65" cy="125" r="10" fill="#2166ac"/><text x="85" y="113" font-size="17" text-anchor="middle" fill="#263445">0</text><circle cx="295" cy="355" r="10" fill="#2166ac"/><text x="315" y="343" font-size="17" text-anchor="middle" fill="#263445">0</text><polygon points="295,114 284,135 306,135" fill="#d66016"/><text x="315" y="113" font-size="17" text-anchor="middle" fill="#263445">1</text><text x="580" y="100" font-size="23" text-anchor="middle" fill="#263445">OR</text><line x1="445" y1="355" x2="730" y2="355" stroke="#9aabb9" stroke-width="2"/><line x1="465" y1="110" x2="465" y2="375" stroke="#9aabb9" stroke-width="2"/><text x="580" y="410" font-siz